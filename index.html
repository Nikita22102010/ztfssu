<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>156</title>

    <style>
        @font-face {
            font-family: "8bitOperator";
            src: url("./8bitoperator_jve.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-family: "8bitOperator", monospace;
        }

        #days {
            font-size: clamp(48px, 15vw, 160px);
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div id="days">156</div>

    <script>
        function updateDays() {
            const start = new Date(2026, 4, 1);
            const today = new Date();

            start.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);

            const days = Math.floor((today - start) / 86400000);

            document.getElementById("days").textContent = days;
            document.title = days;
        }

        updateDays();
        setInterval(updateDays, 60000);

        // Принудительно загружаем шрифт
        document.fonts.load('100px "8bitOperator"');
    </script>
</body>
</html>
